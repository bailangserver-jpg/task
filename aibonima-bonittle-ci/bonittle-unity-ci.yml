name: BONITTLE Unity CI

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonittle-unity-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unity-verification:
    name: Compile + EditMode + PlayMode
    runs-on:
      - self-hosted
      - Windows
      - X64
      - aibonima-bonittle
      - unity-6000.3.25f1
    timeout-minutes: 60

    env:
      AIBONIMA_CI_ARTIFACT_DIR: ${{ runner.temp }}\\aibonima-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Compile and run Unity tests
        id: unity_ci
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\\Tools\\CI\\Invoke-AibonimaUnityCI.ps1" `
            -ProjectPath "$env:GITHUB_WORKSPACE" `
            -UnityExe "C:\\Program Files\\Unity\\Hub\\Editor\\6000.3.25f1\\Editor\\Unity.exe" `
            -MinEditModeTests 4 `
            -MinPlayModeTests 1

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bonittle-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AIBONIMA_CI_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Finalize result
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.unity_ci.outcome }}" -ne "success") {
            throw "AIBONIMA BONITTLE Unity CI failed. Check the uploaded CI evidence artifact."
          }
          Write-Host "AIBONIMA BONITTLE Unity CI PASSED."
